<app-breadcrumb-two title="Orders" subtitle="List"></app-breadcrumb-two>

<section class="order-info container">
  <header
    class="order-info__header d-flex justify-content-between align-items-center pt-40"
  >
    <h2 class="order-info__title">My Orders</h2>
  </header>

  <div class="order-list white-bg table-responsive pt-40">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Order ID</th>
          <th scope="col">Product Name</th>
          <th scope="col">Tracking ID</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let order of paginationOrders; let i = index">
          <tr
            class="clickable-row"
            [attr.aria-label]="'View order #' + order.id + ' details'"
          >
            <td>{{ i + 1 }}</td>
            <td>{{ order.ProductName }}</td>
            <td>
              <button class="os-btn" (click)="addTracking(order)">Add</button>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
  <div class="order__info-btn d-flex justify-content-end mb-20">
    <app-pagination
      [data]="orders"
      [paginate]="paginate"
      (setPage)="setPage($event)"
    >
    </app-pagination>
  </div>
</section>
